[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyactivesync"
version = "0.1.0"
description = "A Python client library exclusively for Exchange ActiveSync 16.1 (EAS / MS-ASCMD / MS-ASWBXML)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Monperrus" }]
keywords = ["exchange", "activesync", "eas", "eas-16.1", "email"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/monperrus/pyactivesync"
Repository = "https://github.com/monperrus/pyactivesync"
Issues = "https://github.com/monperrus/pyactivesync/issues"

[project.scripts]
pyactivesync = "pyactivesync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pyactivesync"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pyactivesync"]
